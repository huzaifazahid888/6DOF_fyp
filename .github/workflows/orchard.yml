name: Orchard Jazzy integration
on:
  push:
    paths: ['robotics_lab/src/pieas_orchard/**', '.github/workflows/orchard.yml']
  pull_request:
    paths: ['robotics_lab/src/pieas_orchard/**', '.github/workflows/orchard.yml']
  workflow_dispatch:
concurrency:
  group: orchard-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  orchard:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Configure ROS package source
        shell: bash
        run: |
          # Pin the known source package; avoid an unauthenticated latest-release lookup.
          curl --fail --location --retry 3 -o /tmp/ros2-apt-source.deb https://github.com/ros-infrastructure/ros-apt-source/releases/download/1.3.0/ros2-apt-source_1.3.0.noble_all.deb
          sudo dpkg -i /tmp/ros2-apt-source.deb
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-colcon-common-extensions python3-rosdep python3-pytest ros-jazzy-desktop ros-jazzy-moveit ros-jazzy-ros-gz ros-jazzy-gz-ros2-control ros-jazzy-ros2-controllers xvfb
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then sudo rosdep init; fi
          rosdep update --rosdistro jazzy
          rosdep install --from-paths robotics_lab/src --ignore-src --rosdistro jazzy -y
      - name: Build and CPU tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd robotics_lab
          colcon build --symlink-install --packages-up-to pieas_orchard --event-handlers console_direct+
          source install/setup.bash
          colcon test --packages-select pieas_orchard --event-handlers console_direct+
          colcon test-result --verbose
      - name: Render and harvest three apples
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          source robotics_lab/install/setup.bash
          xvfb-run -a python3 robotics_lab/src/pieas_orchard/test/runtime_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orchard-results
          path: |
            robotics_lab/log
            /tmp/pieas_orchard_launch.log
            /tmp/pieas_orchard_task.log
            /tmp/pieas_orchard_batch
            /tmp/pieas_orchard_sensors

